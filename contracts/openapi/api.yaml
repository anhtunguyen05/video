openapi: 3.1.0
info:
  title: Mini Video Platform API
  version: 0.1.0
  description: Video resource, direct upload, and upload-event contract for Milestone 3.
servers:
  - url: http://localhost:8080/api/v1
paths:
  /videos:
    post:
      operationId: createVideo
      summary: Create a video resource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVideoRequest'
      responses:
        '201':
          description: Video created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
    get:
      operationId: listVideos
      summary: List videos owned by the current user
      parameters:
        - $ref: '#/components/parameters/Limit'
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Video list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoListEnvelope'
  /videos/{videoId}:
    parameters:
      - $ref: '#/components/parameters/VideoId'
    get:
      operationId: getVideo
      summary: Get an owned video
      responses:
        '200':
          description: Video details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteVideo
      summary: Delete an owned video
      responses:
        '204':
          description: Video deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /videos/{videoId}/uploads:
    parameters:
      - $ref: '#/components/parameters/VideoId'
    post:
      operationId: createVideoUpload
      summary: Create a direct-to-object-storage upload session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUploadRequest'
      responses:
        '201':
          description: Upload session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /uploads/{uploadId}/complete:
    parameters:
      - $ref: '#/components/parameters/UploadId'
    post:
      operationId: completeUpload
      summary: Confirm that a direct upload completed
      responses:
        '200':
          description: Upload confirmed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadCompleteEnvelope'
        '404':
          $ref: '#/components/responses/UploadNotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /uploads/{uploadId}/abort:
    parameters:
      - $ref: '#/components/parameters/UploadId'
    post:
      operationId: abortUpload
      summary: Abort a direct upload session
      responses:
        '204':
          description: Upload aborted
        '404':
          $ref: '#/components/responses/UploadNotFound'
        '409':
          $ref: '#/components/responses/Conflict'
components:
  parameters:
    VideoId:
      name: videoId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UploadId:
      name: uploadId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Video not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: Invalid video state
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    PayloadTooLarge:
      description: Upload exceeds the configured size limit
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    UnsupportedMediaType:
      description: Upload media type is not supported
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    UploadNotFound:
      description: Upload session not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    CreateVideoRequest:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        original_filename:
          type: string
          maxLength: 255
    Video:
      type: object
      required:
        - id
        - title
        - status
        - metadata
        - failure
        - processing_version
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        original_filename:
          type: string
          nullable: true
        status:
          type: string
          enum: [CREATED, UPLOADING, UPLOADED, QUEUED, PROCESSING, READY, FAILED, DELETED]
        metadata:
          allOf:
            - $ref: '#/components/schemas/VideoMetadata'
          nullable: true
        failure:
          allOf:
            - $ref: '#/components/schemas/VideoFailure'
          nullable: true
        processing_version:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    VideoMetadata:
      type: object
      properties:
        duration_ms:
          type: integer
          format: int64
          nullable: true
        width:
          type: integer
          nullable: true
        height:
          type: integer
          nullable: true
        codec:
          type: string
          nullable: true
        container:
          type: string
          nullable: true
        source_size_bytes:
          type: integer
          format: int64
          nullable: true
        frame_rate:
          type: number
          format: double
          nullable: true
    VideoFailure:
      type: object
      properties:
        code:
          type: string
          nullable: true
        message:
          type: string
          nullable: true
    VideoEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Video'
    VideoList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Video'
        next_cursor:
          type: string
          nullable: true
    VideoListEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/VideoList'
    CreateUploadRequest:
      type: object
      required: [content_type, size_bytes]
      properties:
        content_type:
          type: string
          enum: [video/mp4, video/webm]
        size_bytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 104857600
    Upload:
      type: object
      required: [upload_id, upload_url, method, headers, expires_at]
      properties:
        upload_id:
          type: string
          format: uuid
        upload_url:
          type: string
          format: uri
        method:
          type: string
          enum: [PUT]
        headers:
          type: object
          additionalProperties:
            type: string
        expires_at:
          type: string
          format: date-time
    UploadEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Upload'
    UploadComplete:
      type: object
      required: [video_id, status]
      properties:
        video_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [UPLOADED]
    UploadCompleteEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/UploadComplete'
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            request_id:
              type: string
