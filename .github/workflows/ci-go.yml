name: CI - Go

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: |
            services/api/go.sum
            services/worker/go.sum

      - name: Go format
        shell: bash
        run: test -z "$(gofmt -l services/api services/worker)"

      - name: Go test
        run: |
          (cd services/api && go test ./...)
          (cd services/worker && go test ./...)

      - name: Go vet
        run: |
          (cd services/api && go vet ./...)
          (cd services/worker && go vet ./...)

      - name: Build API
        working-directory: services/api
        run: go build ./...

      - name: Build Worker
        working-directory: services/worker
        run: go build ./...
