name: CI - Python

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  subtitles:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: video
          POSTGRES_USER: video
          POSTGRES_PASSWORD: video
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U video -d video"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:3.13.7-management-alpine
        ports:
          - 5672/tcp
        options: >-
          --health-cmd "rabbitmq-diagnostics -q check_port_connectivity"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/subtitles/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r services/subtitles/requirements.txt

      - name: Apply migrations to isolated database
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          for migration in migrations/*.up.sql; do
            docker exec -i "$POSTGRES_CONTAINER" psql -v ON_ERROR_STOP=1 -U video -d video < "$migration"
          done

      - name: Run subtitle tests
        working-directory: services/subtitles
        env:
          TEST_DATABASE_URL: postgres://video:video@localhost:${{ job.services.postgres.ports[5432] }}/video
          TEST_RABBITMQ_URL: amqp://guest:guest@localhost:${{ job.services.rabbitmq.ports[5672] }}/
        run: |
          python -B - <<'PY'
          import sys
          import unittest

          suite = unittest.defaultTestLoader.discover('tests')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful() or result.skipped or result.testsRun == 0:
              sys.exit(1)
          PY

      - name: Build subtitle image
        run: docker build -t video-platform-subtitles:ci services/subtitles
